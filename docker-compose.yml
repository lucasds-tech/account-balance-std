services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: accbalance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accbalance_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accbalance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      APP_TIMEZONE: America/Sao_Paulo
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\\\"status\\\":\\\"UP\\\"' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    container_name: ingestor
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accbalance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_SQS_REGION: sa-east-1
      AWS_SQS_ACCESS_KEY: test
      AWS_SQS_SECRET_KEY: test
      AWS_SQS_QUEUE_NAME: transacoes-financeiras-processadas
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q '\\\"status\\\":\\\"UP\\\"' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  localstack:
    image: localstack/localstack:3.7.2
    hostname: localstack
    container_name: localstack
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SERVICES=sqs
      - SKIP_SSL_CERT_DOWNLOAD=1
      - DISABLE_EVENTS=1
    ports:
      - "4566:4566"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
